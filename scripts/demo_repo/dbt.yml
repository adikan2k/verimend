name: dbt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install --quiet "dbt-core~=1.10.11" "dbt-duckdb~=1.9.3"
      - name: Load the raw data
        run: python scripts/load_raw.py
      - name: Build
        run: dbt build --profiles-dir .
      - name: VeriMend
        if: failure()
        uses: adikan2k/verimend/action@ACTION_REF
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          max-usd: "0.25"
