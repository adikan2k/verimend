[project]
name = "verimend-verifier"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Independent verifier for dbt fixes: tamper checks, masking checks and a clean rebuild. Knows nothing about the agent."
requires-python = ">=3.12"
# Keep this list free of verimend and of the Agent SDK (CLAUDE.md rule 5).
dependencies = [
    # Both already arrive with dbt-duckdb; the verifier uses them directly. Lower bounds
    # cover the DuckDB 1.2 in data-eng-bench's image; uv.lock pins what the host runs.
    "duckdb>=1.1",
    "pyyaml>=6.0.1,<7",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "verifier"
module-root = "src"
